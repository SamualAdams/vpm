[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpm"
version = "0.1.0"
description = "Bootstrap workspace for a local virtual project manager."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "mcp>=1.26,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
vpm = "vpm.__main__:main"
vpm-mcp = "vpm.mcp_server:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=1.0,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["vpm", "vpm.routes"]
